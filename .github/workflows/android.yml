name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check Supabase secrets are complete
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          ok=1
          if printf '%s' "$KEY" | LC_ALL=C grep -q '[^!-~]'; then echo "::error::VITE_SUPABASE_ANON_KEY contains spaces or non-ASCII characters (e.g. '…' from a shortened copy). Re-copy it with the copy button in Supabase → Project Settings → API Keys."; ok=0; fi
          case "$URL" in https://*.supabase.co) ;; *) echo "::error::VITE_SUPABASE_URL should look like https://xxxx.supabase.co"; ok=0;; esac
          echo "Key length: ${#KEY}"
          [ $ok = 1 ]

      - name: Install & build web app
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Add Firebase config (push notifications)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; echo "google-services.json added"; else echo "::warning::GOOGLE_SERVICES_JSON secret not set — family push alerts disabled in this APK"; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building a debug APK instead (updates may need uninstall)."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            # Re-sign with v1 (JAR) + v2 + v3 so strict OEM installers (OPPO/Realme/Vivo) accept it
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            "$BT/apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out ../VitalNest.apk app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../VitalNest.apk
          fi

      - name: Verify APK signature and Android version support
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --min-sdk-version 21 VitalNest.apk | head -12
          "$BT/aapt2" dump badging VitalNest.apk | grep -iE "^package|sdkVersion" || true
          ls -l VitalNest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VitalNest-apk
          path: VitalNest.apk

      - name: Publish as a GitHub Release (download link for the family)
        if: env.ANDROID_KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VitalNest 1.0.${{ github.run_number }}
          body: |
            Install on Android: download **VitalNest.apk** below → open it → allow "Install unknown apps" if asked.
            Updating? Just install the new APK over the old one — your data is safe in the cloud.
            If you see "problem parsing the package", free up some phone storage and try again.
          files: VitalNest.apk
          make_latest: true
