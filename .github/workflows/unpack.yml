name: Unpack uploaded source

on:
  push:
    paths: ['vitalnest-source.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          unzip -o -q vitalnest-source.zip -x '.github/*'
          git rm -q --cached vitalnest-source.zip && rm vitalnest-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add VitalNest source"
          git push
