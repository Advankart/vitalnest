<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VitalNest</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#0f766e;color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .c{max-width:20rem} h1{font-size:1.4rem;margin:.8rem 0 .4rem} p{opacity:.85;line-height:1.5;margin:0 0 1.4rem}
  button{font:inherit;font-weight:600;background:#fff;color:#0f766e;border:0;border-radius:14px;padding:.9rem 1.6rem;font-size:1rem}
</style></head>
<body><div class="c">
  <div style="font-size:3rem">📶</div>
  <h1>No internet connection</h1>
  <p>VitalNest needs the internet the first time it opens. Check Wi-Fi or mobile data and try again.</p>
  <button onclick="location.href='https://vitalnest.vercel.app/'">Try again</button>
</div>
<script>addEventListener('online',function(){location.href='https://vitalnest.vercel.app/'})</script>
</body></html>
